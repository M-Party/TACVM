[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacvm-operation-cvm-policy-coordinator"
version = "0.3.0"
description = "Operation CVM policy negotiation, distribution, confirmation, and activation"
requires-python = ">=3.9"
dependencies = [
  "cryptography>=41",
  "tacvm-policy-aggregation-core==0.3.0",
  "tacvm-protocol==0.1.0",
]

[tool.setuptools]
py-modules = ["coordinator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacvm-policy-aggregation-core"
version = "0.3.0"
description = "Deterministic restrictive policy aggregation core for TACVM"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["tacvm_policy_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

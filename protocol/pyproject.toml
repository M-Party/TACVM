[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacvm-protocol"
version = "0.1.0"
description = "Canonical domain-separated encoding helpers for TACVM"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["tacvm_protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

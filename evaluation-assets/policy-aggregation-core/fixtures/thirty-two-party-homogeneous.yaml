- schema: tacvm-policy-proposal/v0.2
  context:
    policy_id: sha384:POLICY_SCALE_32
    version: 1
    round: 0
  author:
    participant_id: id_01
  defaults:
    roles: DENY
    workload_cvms: DENY
    artifacts: DENY
    secret_release: DENY
    communications: DENY
    lifecycle: DENY
  roles:
    assignments:
      id_01: model_owner
      id_02: data_owner
      id_03: operator
      id_04: observer
      id_05: observer
      id_06: observer
      id_07: observer
      id_08: observer
      id_09: observer
      id_10: observer
      id_11: observer
      id_12: observer
      id_13: observer
      id_14: observer
      id_15: observer
      id_16: observer
      id_17: observer
      id_18: observer
      id_19: observer
      id_20: observer
      id_21: observer
      id_22: observer
      id_23: observer
      id_24: observer
      id_25: observer
      id_26: observer
      id_27: observer
      id_28: observer
      id_29: observer
      id_30: observer
      id_31: observer
      id_32: observer
  workload_cvms:
    entries:
      inference-cvm:
        tee_type: tdx
        measurements:
          mrtd:
            allowed:
            - MRTD_A
          rtmr: {}
          rootfs:
            scheme: dm_verity
            allowed_root_hashes:
            - ROOTFS_R1
        quote_verification:
          require_valid_chain: true
          accepted_tcb_statuses:
          - UP_TO_DATE
        launch_context:
          required_fields:
          - workload_cvm_id
          - policy_id
          - operation_cvm_channel_key
        trusted_service_channel:
          single_post_boot_quote_required: true
          proof_of_key_possession_required: true
  artifacts:
    entries:
      inference-service:
        kind: container
        allowed_content_digests:
        - ARTIFACT_H1
        encryption: REQUIRED
        registrars:
        - role:model_owner
  secret_release:
    entries:
      bundle-key:
        secret_type: artifact_key
        artifact: inference-service
        workload_cvms:
        - inference-cvm
        operations:
        - admit
        - update
        requesters:
        - role:model_owner
        - role:operator
        require_authenticated_binding: true
        require_artifact_digest_match: true
  communications:
    entries:
      client-api:
        direction: egress
        protocol: tcp
        endpoints:
        - host: api.collaboration.test
          ports:
          - 443
        peer_identity:
          spki_sha256:
          - CLIENT_SPKI
  lifecycle:
    rules:
    - id: admit
      workload: inference-service
      workload_cvm: inference-cvm
      operation: admit
      requester: role:operator
      from: absent
      to: running
      artifact: inference-service
      secrets:
      - bundle-key
      communication_profiles:
      - client-api
    - id: update
      workload: inference-service
      workload_cvm: inference-cvm
      operation: update
      requester: role:model_owner
      from: running
      to: running
      artifact: inference-service
      secrets:
      - bundle-key
      communication_profiles:
      - client-api
    - id: stop
      workload: inference-service
      workload_cvm: inference-cvm
      operation: stop
      requester: role:operator
      from: running
      to: stopped
      artifact: null
      secrets: []
      communication_profiles: []
    - id: delete-stopped
      workload: inference-service
      workload_cvm: inference-cvm
      operation: delete
      requester: role:operator
      from: stopped
      to: absent
      artifact: null
      secrets: []

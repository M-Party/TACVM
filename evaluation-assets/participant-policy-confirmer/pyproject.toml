[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacvm-participant-policy-confirmer"
version = "0.3.0"
description = "Participant-side TACVM candidate policy verification and confirmation"
requires-python = ">=3.9"
dependencies = [
  "cryptography>=41",
  "PyYAML>=6",
  "tacvm-policy-aggregation-core==0.3.0",
]

[tool.setuptools]
py-modules = ["confirm_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

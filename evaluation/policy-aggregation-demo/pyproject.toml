[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacvm-policy-aggregation"
version = "0.1.0"
description = "Executable TACVM multi-participant policy aggregation prototype"
requires-python = ">=3.9"
dependencies = [
  "cryptography>=41",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["tacvm_policy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

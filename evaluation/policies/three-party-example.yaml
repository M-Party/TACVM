# Test-only fixture. Symbolic hashes keep the join readable and must be replaced
# with real digests before an end-to-end run.

fixture_schema: tacvm-policy-join-fixture/v0.1
description: Three participants constrain one confidential inference service.

symbols:
  MRTD_A: sha384:MRTD_A
  MRTD_B: sha384:MRTD_B
  MRTD_C: sha384:MRTD_C
  ROOTFS_R1: sha384:ROOTFS_R1
  ROOTFS_R2: sha384:ROOTFS_R2
  ARTIFACT_H1: sha256:ARTIFACT_H1
  ARTIFACT_H2: sha256:ARTIFACT_H2
  ARTIFACT_H3: sha256:ARTIFACT_H3
  CLIENT_SPKI: sha256:CLIENT_SPKI
  TELEMETRY_SPKI: sha256:TELEMETRY_SPKI
  ADMIN_SPKI: sha256:ADMIN_SPKI

shared_context:
  policy_id: sha384:POLICY_TEST_001
  version: 1
  round: 0
  roster_digest: sha384:ROSTER_TEST_001

shared_roles:
  s1: model_owner
  s2: data_owner
  s3: operator

proposals:
  - author: s1
    defaults:
      roles: DENY
      workload_cvms: DENY
      artifacts: DENY
      secret_release: DENY
      communications: DENY
      lifecycle: DENY
    workload_cvms:
      inference-cvm:
        mrtd_allowed: [MRTD_A, MRTD_B]
        rootfs_allowed: [ROOTFS_R1]
        accepted_tcb_statuses: [UP_TO_DATE]
        require_launch_context: true
        require_trusted_service_channel_binding: true
    artifacts:
      inference-service:
        digests: [ARTIFACT_H1, ARTIFACT_H2]
        encryption: REQUIRED
        registrars: ["role:model_owner"]
    secret_release:
      bundle-key:
        all_of:
          - authenticated_workload_binding
          - artifact_digest_match
          - operation_in: [admit, update]
    communications:
      client-api:
        endpoints:
          - [api.collaboration.test, 443, CLIENT_SPKI]
          - [telemetry.collaboration.test, 443, TELEMETRY_SPKI]
    lifecycle:
      inference-service:
        admit:
          "role:operator": [[absent, running]]
        update:
          "role:model_owner": [[running, running]]
        stop:
          "role:operator": [[running, stopped]]
        delete:
          "role:operator": [[running, absent], [stopped, absent]]

  - author: s2
    defaults:
      roles: DENY
      workload_cvms: DENY
      artifacts: DENY
      secret_release: DENY
      communications: DENY
      lifecycle: DENY
    workload_cvms:
      inference-cvm:
        mrtd_allowed: [MRTD_A]
        rootfs_allowed: [ROOTFS_R1, ROOTFS_R2]
        accepted_tcb_statuses: [UP_TO_DATE]
        require_launch_context: true
        require_trusted_service_channel_binding: true
    artifacts:
      inference-service:
        digests: [ARTIFACT_H1]
        encryption: REQUIRED
        registrars: ["role:model_owner"]
    secret_release:
      bundle-key:
        all_of:
          - authenticated_workload_binding
          - communication_profile_in: [client-api]
    communications:
      client-api:
        endpoints:
          - [api.collaboration.test, 443, CLIENT_SPKI]
    lifecycle:
      inference-service:
        admit:
          "role:operator": [[absent, running]]
        update:
          "role:model_owner": [[running, running]]
        stop:
          "role:operator": [[running, stopped]]
        delete:
          "role:operator": [[stopped, absent]]

  - author: s3
    defaults:
      roles: DENY
      workload_cvms: DENY
      artifacts: DENY
      secret_release: DENY
      communications: DENY
      lifecycle: DENY
    workload_cvms:
      inference-cvm:
        mrtd_allowed: [MRTD_A, MRTD_C]
        rootfs_allowed: [ROOTFS_R1]
        accepted_tcb_statuses: [UP_TO_DATE, CONFIGURATION_NEEDED]
        require_launch_context: true
        require_trusted_service_channel_binding: true
    artifacts:
      inference-service:
        digests: [ARTIFACT_H1, ARTIFACT_H3]
        encryption: REQUIRED
        registrars: ["role:model_owner"]
    secret_release:
      bundle-key:
        all_of:
          - authenticated_workload_binding
    communications:
      client-api:
        endpoints:
          - [api.collaboration.test, 443, CLIENT_SPKI]
          - [admin.collaboration.test, 443, ADMIN_SPKI]
    lifecycle:
      inference-service:
        admit:
          "role:operator": [[absent, running]]
        update:
          "role:model_owner": [[running, running]]
        stop:
          "role:operator": [[running, stopped]]
        delete:
          "role:operator": [[stopped, absent]]

expected_join:
  status: SUCCESS
  workload_cvms:
    inference-cvm:
      mrtd_allowed: [MRTD_A]
      rootfs_allowed: [ROOTFS_R1]
      accepted_tcb_statuses: [UP_TO_DATE]
      require_launch_context: true
      require_trusted_service_channel_binding: true
  artifacts:
    inference-service:
      digests: [ARTIFACT_H1]
      encryption: REQUIRED
      registrars: ["role:model_owner"]
  secret_release:
    bundle-key:
      all_of:
        - authenticated_workload_binding
        - artifact_digest_match
        - operation_in: [admit, update]
        - communication_profile_in: [client-api]
  communications:
    client-api:
      endpoints:
        - [api.collaboration.test, 443, CLIENT_SPKI]
  lifecycle:
    inference-service:
      admit:
        "role:operator": [[absent, running]]
      update:
        "role:model_owner": [[running, running]]
      stop:
        "role:operator": [[running, stopped]]
      delete:
        "role:operator": [[stopped, absent]]

negative_fixtures:
  - name: conflicting_role_assignment
    mutation: Assign `s3` to `auditor` in one proposal.
    expected: BOTTOM_ROLE_CONFLICT
  - name: disjoint_measurements
    mutation: Replace s2's `mrtd_allowed` with `[MRTD_C]`.
    expected: BOTTOM_EMPTY_WORKLOAD_CVM_IDENTITY
  - name: disjoint_artifacts
    mutation: Replace s2's artifact digest with `[ARTIFACT_H3]`.
    expected: BOTTOM_EMPTY_ARTIFACT_SET
  - name: empty_lifecycle_permission
    mutation: Remove the stopped-to-absent edge from s2.
    expected: SUCCESS_WITH_DELETE_DENIED_FOR_OPERATOR
